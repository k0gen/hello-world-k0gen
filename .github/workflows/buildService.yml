name: Build Service

on:
  workflow_dispatch:
  pull_request:
    paths-ignore: ['*.md']
    branches: ['main', 'master', 'update/040']
  push:
    paths-ignore: ['*.md']
    branches: ['main', 'master', 'update/040']

jobs:
  BuildPackage:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare StartOS SDK
        uses: k0gen/sdk@v2

      - name: Checkout services repository
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          install: true
      
      - name: Verify Docker installation
        run: |
          # Check if Docker is installed and in PATH
          if ! command -v docker &> /dev/null; then
            echo "Docker not found in PATH. Attempting to locate and add to PATH..."
            DOCKER_PATH=$(sudo find / -name docker -type f -executable 2>/dev/null | head -n 1)
            if [ -n "$DOCKER_PATH" ]; then
              echo "Found Docker at $DOCKER_PATH"
              echo "$(dirname $DOCKER_PATH)" >> $GITHUB_PATH
              echo "Added Docker directory to PATH"
            else
              echo "Docker executable not found. Please ensure Docker is installed."
              exit 1
            fi
          else
            echo "Docker is already in PATH"
          fi
          # Verify Docker is now accessible
          docker --version
          docker info
      
      - name: Setup binfmt
        run: |
          docker run --privileged --rm tonistiigi/binfmt --install all
      
      - name: Build the service package
        id: build
        run: |
          git submodule update --init --recursive
          start-cli init
          RUST_LOG=debug RUST_BACKTRACE=1 make
          echo "package_id=$(grep -o "id: '[^']*'" startos/manifest.ts | sed "s/id: '\([^']*\)'/\1/")" >> $GITHUB_ENV
          printf "\n SHA256SUM: $(sha256sum ${PACKAGE_ID}.s9pk) \n"
        shell: bash

      - name: Upload .s9pk
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.package_id }}.s9pk
          path: ./${{ env.package_id }}.s9pk
